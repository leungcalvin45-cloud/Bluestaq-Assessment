[project]
name = "team-notes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "pydantic-settings>=2,<3", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "httpx2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
# Avoid recurring Windows filesystem errors when pytest writes its optional cache.
addopts = "-p no:cacheprovider"
